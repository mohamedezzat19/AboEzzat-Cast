name: Build AboEzzat Cast APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are not configured. A Debug APK will not be built."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/classic-release-keystore.jks"
          ALIAS="${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS }}"
          if [[ -z "$ALIAS" ]]; then
            echo "::error::Signing alias secret is missing."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/classic-release-keystore.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/classic-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed Classic APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.aboezzat.share.legacy'"
          echo "$BADGING" | grep -q "versionCode='${GITHUB_RUN_NUMBER}'"

      - name: Ensure signing key matches the last published release
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          HTTP_STATUS="$(curl -sS -o "$RUNNER_TEMP/latest-release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API")"

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo "No previous release exists; signer continuity check will start with this release."
            exit 0
          fi
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Could not inspect the latest release (HTTP $HTTP_STATUS). Refusing to publish an unchecked APK."
            exit 1
          fi

          PREVIOUS_APK_URL="$(jq -r '.assets[]? | select(.name == "app-release.apk") | .browser_download_url' "$RUNNER_TEMP/latest-release.json" | head -n 1)"
          if [[ -z "$PREVIOUS_APK_URL" || "$PREVIOUS_APK_URL" == "null" ]]; then
            echo "::error::The latest release has no app-release.apk to verify against. Refusing to publish."
            exit 1
          fi

          curl -fL --retry 3 "$PREVIOUS_APK_URL" -o "$RUNNER_TEMP/previous-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/current-apk-signature.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/previous-release.apk" > "$RUNNER_TEMP/previous-apk-signature.txt"
          CURRENT_CERT="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/current-apk-signature.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          PREVIOUS_CERT="$(sed -n 's/.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/previous-apk-signature.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [[ -z "$CURRENT_CERT" || -z "$PREVIOUS_CERT" || "$CURRENT_CERT" != "$PREVIOUS_CERT" ]]; then
            echo "::error::Signing certificate differs from the latest published Cast APK. Update blocked to prevent Android signature-install failures."
            exit 1
          fi

          echo "Signing certificate matches the latest published Cast release."

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-Cast-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed APK Release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cast-build-${{ github.run_number }}
          name: AboEzzat Cast Release ${{ github.run_number }}
          body: "versionCode: ${{ github.run_number }}\\nSigned AboEzzat Cast APK for in-app updates."
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
